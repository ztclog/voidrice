autofit-larger=50%x50%
geometry=50%:50%
save-position-on-quit=yes
screenshot-directory="~/"

demuxer-max-bytes=1000M	
demuxer-max-back-bytes=200M
demuxer-readahead-secs=300

vo=gpu-next
hwdec=vulkan				# AMD/Intel显卡使用vaapi硬解；Nvidia请改为nvdec; vulkan实测最高能效 240Hz显示器不必开插帧
profile=high-quality			# gpu-hq与之等价 包含scale hdr等设置
cscale=ewa_lanczossharp
dscale=mitchell

slang=chi				# 自动优先加载中文字幕
sub-font="serif"			# 字幕字体
sub-font-size=40			# 字幕字号大小

ytdl-raw-options=cookies-from-browser=firefox,yes-playlist=
ytdl-format="((bestvideo[vcodec^=av01][height>=2160]/bestvideo[vcodec^=vp9][height>=2160]/bestvideo[vcodec^=av01]/bestvideo[vcodec^=vp9]/bestvideo)+(bestaudio[acodec^=flac]/bestaudio[acodec^=opus]/bestaudio[acodec^=aac]/bestaudio))/best"

[extension.gif]
loop-file=inf
